name: "CD – Stage Deploy"

on:
  push:
    branches: [ "stage" ]
  pull_request:
    branches: [ "stage" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REPO_OWNER: ${{ github.repository_owner }}
  PROJECT_NAME: video_streaming

jobs:
  # ---------------- Detect changed services ----------------
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      auth: ${{ steps.filter.outputs.auth }}
      convertor: ${{ steps.filter.outputs.convertor }}
      moderation: ${{ steps.filter.outputs.moderation }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - uses: actions/checkout@v5

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            auth:
              - 'services/auth/**'
            convertor:
              - 'services/convertor/**'
            moderation:
              - 'services/moderation/**'
            frontend:
              - 'frontend/**'

      - run: echo "✅ Detected changed services"

  # ---------------- Build, push & deploy per-service ----------------
  deploy:
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            path: ./backend
          - service: auth
            path: ./services/auth
          - service: convertor
            path: ./services/convertor
          - service: moderation
            path: ./services/moderation
          - service: frontend
            path: ./frontend

    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'stage' }}

    steps:
      - uses: actions/checkout@v5

      # --- Only build if folder changed ---
      - name: 🧱 Build Docker image
        if: ${{ needs.detect-changes.outputs[matrix.service] == 'true' }}
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/${{ env.PROJECT_NAME }}-${{ matrix.service }}:${{ github.sha }}
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          docker build -t $IMAGE ${{ matrix.path }}
          echo "✅ Built $IMAGE"

      - name: 🔐 Login to GHCR
        if: ${{ needs.detect-changes.outputs[matrix.service] == 'true' }}
        run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: 📦 Push Docker image
        if: ${{ needs.detect-changes.outputs[matrix.service] == 'true' }}
        run: |
          docker push $IMAGE
          echo "✅ Pushed $IMAGE"
