apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: video-streaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "video-streaming"
        vault.hashicorp.com/agent-inject-secret-minio-env: "secret/data/minio"
        vault.hashicorp.com/agent-inject-template-minio-env: |
          {{- with secret "secret/data/minio" -}}
          {{- range $k, $v := .Data.data }}
          {{ $k }}={{ $v }}
          {{- end }}
          {{- end }}
        vault.hashicorp.com/agent-inject-file-minio-env: "minio.env"
    spec:
      serviceAccountName: vault-auth
      containers:
        - name: minio
          image: minio/minio:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - set -a; . /vault/secrets/minio.env; exec minio server /minio_data --console-address ":9001"
          env:
            - name: MINIO_BROWSER_REDIRECT_URL
              value: http://localhost/minio/ui
            - name: MINIO_PROMETHEUS_URL
              value: http://prometheus:9090
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          volumeMounts:
            - name: data
              mountPath: /minio_data
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: video-streaming
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
