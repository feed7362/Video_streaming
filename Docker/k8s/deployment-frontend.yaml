apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: video-streaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      serviceAccountName: vault-auth
      containers:
        - name: frontend
          image: ghcr.io/video-streaming/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: video-streaming
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 8001
      targetPort: http
