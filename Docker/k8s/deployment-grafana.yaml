apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: video-streaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "video-streaming"
        vault.hashicorp.com/agent-inject-secret-grafana-env: "secret/data/grafana"
        vault.hashicorp.com/agent-inject-template-grafana-env: |
          {{- with secret "secret/data/grafana" -}}
          {{- range $k, $v := .Data.data }}
          {{ $k }}={{ $v }}
          {{- end }}
          {{- end }}
        vault.hashicorp.com/agent-inject-file-grafana-env: "grafana.env"
    spec:
      serviceAccountName: vault-auth
      containers:
        - name: grafana
          image: grafana/grafana:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - set -a; . /vault/secrets/grafana.env; exec /run.sh
          ports:
            - containerPort: 3000
              name: http
          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: grafana-data
              mountPath: /var/lib/grafana
      volumes:
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: video-streaming
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
