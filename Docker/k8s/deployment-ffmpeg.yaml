apiVersion: apps/v1
kind: Deployment
metadata:
  name: ffmpeg
  namespace: video-streaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ffmpeg
  template:
    metadata:
      labels:
        app: ffmpeg
    spec:
      serviceAccountName: vault-auth
      containers:
        - name: ffmpeg
          image: ghcr.io/video-streaming/ffmpeg:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
          ports:
            - containerPort: 8002
              name: http
          resources:
            limits:
              nvidia.com/gpu: 1
            requests:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ffmpeg
  namespace: video-streaming
spec:
  selector:
    app: ffmpeg
  ports:
    - name: http
      port: 8002
      targetPort: http
