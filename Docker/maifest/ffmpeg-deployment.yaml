apiVersion: apps/v1
kind: Deployment
metadata:
  name: ffmpeg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ffmpeg
  template:
    metadata:
      labels:
        app: ffmpeg
    spec:
      containers:
        - name: ffmpeg
          image: ffmpeg-service:latest
          ports:
            - containerPort: 8002
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
          resources:
            limits:
              nvidia.com/gpu: 1
---
apiVersion: v1
kind: Service
metadata:
  name: ffmpeg
spec:
  selector:
    app: ffmpeg
  ports:
    - name: http
      port: 8002
      targetPort: 8002
  type: ClusterIP
