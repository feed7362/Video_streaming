name: video_streaming_stack

services:
  bff:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: bff_service
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    expose:
      - "8000"
    depends_on:
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ffmpeg:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ../backend/alembic/versions:/app/alembic/versions
    environment:
      - VAULT_ADDR=${VAULT_ADDR}
      - VAULT_TOKEN=${VAULT_TOKEN}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:8000/api/health/live" ]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: frontend_service
    restart: unless-stopped
    init: true
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8001/"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"

  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: postgres_service
    environment:
      POSTGRES_MULTIPLE_DATABASES: "${VIDEO_DB}"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/postgres_entrypoint.sh:/docker-entrypoint-initdb.d/postgres_entrypoint.sh
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${VIDEO_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"

  redis:
    image: redis:7-alpine
    container_name: redis_service
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"

  ffmpeg:
    build:
      context: ../services/convertor
      dockerfile: Dockerfile
    container_name: ffmpeg_service
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 1G
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    environment:
      - VAULT_ADDR=${VAULT_ADDR}
      - VAULT_TOKEN=${VAULT_TOKEN}
      - NVIDIA_VISIBLE_DEVICES=all
    expose:
      - "9102"   # metrics ONLY
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:9102/api/health/live" ]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"

  minio:
    image: minio/minio:latest
    container_name: minio_service
    expose:
      - "9000"
      - "9001"
    restart: unless-stopped
    hostname: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ENDPOINT_URL: ${MINIO_ENDPOINT_URL}
      MINIO_REGION_NAME: ${MINIO_REGION_NAME}

      MINIO_BROWSER_REDIRECT_URL: http://localhost/minio/ui
      MINIO_PROMETHEUS_URL: http://prometheus:9090
    #      MINIO_AUDIT_WEBHOOK_ENABLE_logger: "on"
    #      MINIO_AUDIT_WEBHOOK_ENDPOINT_logger: "http://loki:3100/loki/api/v1/push"
    #      MINIO_KMS_AUTO_ENCRYPTION: "on"
    #      MINIO_KMS_MASTER_KEY: "my-key:32byteslongsecretkeymustbe!"
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"

  nginx:
    image: nginx:alpine
    container_name: nginx_gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ../gateway/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      bff:
        condition: service_healthy
      vault:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbit_broker
    restart: always
    expose:
      - "5672"
      - "15672"
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmqctl status" ]
      interval: 10s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"

  promtail:
    image: grafana/promtail:3.3.2
    container_name: promtail
    expose:
      - "9080"
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers
      - /var/run/docker.sock:/var/run/docker.sock
      - ../monitoring/promtail-config.yaml:/etc/promtail/promtail-config.yaml
    command: -config.file=/etc/promtail/promtail-config.yaml
    privileged: true

  loki:
    image: grafana/loki:3.3.2
    container_name: loki
    expose:
      - "3100"
    volumes:
      - ../monitoring/loki-config.yaml:/etc/loki/loki-config.yaml

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    restart: unless-stopped
    expose:
      - "9090"
    volumes:
      - ../monitoring/prometheus.yaml:/etc/prometheus/prometheus.yaml
      - ../monitoring/alert.rules.yml:/etc/prometheus/alert.rules.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--web.enable-lifecycle"
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    expose:
      - "9093"
    volumes:
      - ../monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    logging:
      driver: "json-file"
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"

  grafana:
    image: grafana/grafana:11.3.1
    container_name: grafana
    expose:
      - "3000"
    environment:
      # Must be set in .env — compose will refuse to start if missing/empty
      # (the :? syntax errors out on unset/empty values).
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set in .env}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SERVER_ROOT_URL=http://localhost/grafana
    volumes:
      - ../monitoring/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - grafana_data:/var/lib/grafana


  vault:
    image: hashicorp/vault:1.18.3
    command: sh -c "chown -R vault:vault /opt/vault/data && vault server -config=/etc/vault/vault.hcl"
    container_name: vault
    restart: always
    expose:
      - "8200"
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_API_ADDR: "http://vault:8200"
      VAULT_CLUSTER_ADDR: "http://vault:8201"
      VAULT_TOKEN: "${VAULT_TOKEN}"
    volumes:
      - vault_data:/opt/vault/data
      - ../vault/config:/etc/vault
      - ../vault/tls:/etc/vault/tls
    healthcheck:
      # `vault status` exits 0 only when unsealed; exit 2 while sealed.
      # Dependents wait until the unsealer sidecar finishes.
      test: [ "CMD", "vault", "status", "-address=http://localhost:8200" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"

  vault-unsealer:
    # ~10MB alpine+curl. We only need HTTP POST /v1/sys/unseal — no vault CLI required.
    image: curlimages/curl:latest
    container_name: vault_unsealer
    restart: "no"
    depends_on:
      - vault
    env_file:
      - ../vault/unseal-keys.env
    entrypoint: ["/bin/sh", "-c"]
    command: |
      'set -eu;
       VAULT=http://vault:8200;
       echo "[unsealer] waiting for vault...";
       i=0;
       until curl -fsS "$$VAULT/v1/sys/seal-status" >/tmp/s 2>/dev/null; do
         i=$$((i+1)); [ $$i -gt 60 ] && echo "[unsealer] vault never came up" && exit 1;
         sleep 2;
       done;
       if grep -q "\"sealed\":false" /tmp/s; then
         echo "[unsealer] already unsealed"; exit 0;
       fi;
       echo "[unsealer] unsealing...";
       for K in "$$VAULT_UNSEAL_KEY_1" "$$VAULT_UNSEAL_KEY_2" "$$VAULT_UNSEAL_KEY_3"; do
         curl -fsS -X POST -d "{\"key\":\"$$K\"}" "$$VAULT/v1/sys/unseal" >/tmp/s;
       done;
       if grep -q "\"sealed\":false" /tmp/s; then
         echo "[unsealer] OK — vault unsealed";
       else
         echo "[unsealer] FAILED — response: $$(cat /tmp/s)"; exit 1;
       fi;'
    logging:
      driver: "json-file"
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"

  elasticsearch:
    image: elasticsearch:9.2.0
    container_name: elasticsearch_service
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G
    environment:
      - node.name=es01
      - cluster.name=${CLUSTER_NAME}
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.license.self_generated.type=${LICENSE}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    expose:
      - "9200"  # Elasticsearch REST API
    healthcheck:
      test: [ "CMD-SHELL", "curl -fs -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health >/dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  default:
    name: video_streaming_network
    external: true

volumes:
  minio_data:
  grafana_data:
  prometheus_data:
  alertmanager_data:
  postgres_data:
  vault_data:
  es_data:
  redis-data:
