version: 1
disable_existing_loggers: False
filters:
  request_id:
    (): src.correlation.RequestIdLogFilter
formatters:
  default:
    format: "%(asctime)s - %(name)s - %(levelname)s - [rid=%(request_id)s] %(message)s"
  access:
    format: "%(asctime)s - %(name)s - %(levelname)s - [rid=%(request_id)s] %(message)s"
handlers:
  default:
    formatter: default
    class: logging.StreamHandler
    stream: ext://sys.stderr
    filters: [request_id]
  access:
    formatter: access
    class: logging.StreamHandler
    stream: ext://sys.stdout
    filters: [request_id]
loggers:
  uvicorn.error:
    level: INFO
    handlers:
      - default
    propagate: no
  uvicorn.access:
    level: INFO
    handlers:
      - access
    propagate: no
root:
  level: DEBUG
  handlers:
    - default
  propagate: no
