worker_processes auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_types text/plain application/javascript application/x-javascript text/css application/json;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;

    # NOTE: upstream blocks removed. The `resolve` flag on `server` is NGINX Plus only;
    # on open-source nginx it is silently ignored, so hostnames get cached at startup
    # and any container restart causes permanent 502s until nginx restarts.
    # We use `set $var hostname; proxy_pass http://$var;` per-location so nginx uses
    # the `resolver` directive on every request and picks up new container IPs.

    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_connect_timeout 5s;

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;
        http2 on;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "strict-origin-when-cross-origin";

        client_max_body_size 1000m;


        location / {
            set $upstream_frontend frontend:8001;
            proxy_pass http://$upstream_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/minio/(?!ui/)(?<bucket>[^/]+)/(?<path>.*)$ {
            proxy_buffering off;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";

            # 1. Authorize and get the full signed URL from the backend
            auth_request /signer;
            auth_request_set $signed_url $upstream_http_x_signed_url;

            # 2. Extract query string from signed URL
            set $captured_query "";
            if ($signed_url ~ \?(.*)) {
                set $captured_query $1;
            }

            # 3. Proxy the original request to the full signed URL
            proxy_pass $signed_url;

            # 4. For manifest files, rewrite their content
            # This finds lines that don't start with '#' and appends the signature
            sub_filter_types application/vnd.apple.mpegurl;
            sub_filter '.m3u8' '.m3u8?$captured_query';
            sub_filter '.ts' '.ts?$captured_query';
            sub_filter_once off;
        }

        location = /signer {
            internal;
            set $upstream_bff bff:8000;
            proxy_pass http://$upstream_bff/api/files/sign_url?file_path=$request_uri;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
        }

        location ~ ^/api/(.*?)(/.*)?$ {
            set $upstream_bff bff:8000;
            proxy_pass http://$upstream_bff/api/$1$2$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /docs {
            set $upstream_bff bff:8000;
            proxy_pass http://$upstream_bff/docs;
        }

        location /openapi.json {
            set $upstream_bff bff:8000;
            proxy_pass http://$upstream_bff/openapi.json;
        }

        location /minio/ {
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 300;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            chunked_transfer_encoding off;
            set $upstream_minio minio:9000;
            proxy_pass http://$upstream_minio/;
            proxy_buffering off;
        }

        location /minio/ui/ {
            rewrite ^/minio/ui/(.*) /$1 break;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-NginX-Proxy true;

            real_ip_header X-Real-IP;

            proxy_connect_timeout 300;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_redirect off;
            chunked_transfer_encoding off;

            set $upstream_minio_ui minio:9001;
            proxy_pass http://$upstream_minio_ui;

        }

        location ~* /rabbitmq/api/(.*?)/(.*) {
            set $upstream_rabbit rabbitmq:15672;
            proxy_pass http://$upstream_rabbit/api/$1/%2F/$2?$query_string;
        }

        location ~* /rabbitmq/(.*) {
            rewrite ^/rabbitmq/(.*)$ /$1 break;
            set $upstream_rabbit rabbitmq:15672;
            proxy_pass http://$upstream_rabbit;
        }

        location /grafana/ {
            set $upstream_grafana grafana:3000;
            proxy_pass http://$upstream_grafana;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_redirect off;
        }

        location /prometheus/ {
            set $upstream_prom prometheus:9090;
            proxy_pass http://$upstream_prom/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        location /rabbitmq {
            rewrite ^/rabbitmq$ /rabbitmq/ permanent;
        }

        location /ui/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;

            set $upstream_vault vault:8200;
            proxy_pass http://$upstream_vault/ui/;
        }

        location /v1/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;

            set $upstream_vault vault:8200;
            proxy_pass http://$upstream_vault/v1/;
        }
    }
}
