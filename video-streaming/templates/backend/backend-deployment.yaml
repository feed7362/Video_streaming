apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "video-streaming.fullname" . }}-backend
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ include "video-streaming.name" . }}
    component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "video-streaming.name" . }}
      component: backend
  template:
    metadata:
      labels:
        app: {{ include "video-streaming.name" . }}
        component: backend
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ .name | default . }}
        {{- end }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: 8000
          # env, envFrom, volumeMounts, etc. will be added later
