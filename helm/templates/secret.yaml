{{- if not .Values.secret.existingSecret -}}
{{- $jwt := .Values.secret.data.JWT_SECRET -}}
{{- if not $jwt -}}
{{- if eq .Release.IsInstall true -}}
{{- fail "secret.data.JWT_SECRET is empty. Set it to a string of at least 32 chars, or point `secret.existingSecret` at an external Secret." -}}
{{- end -}}
{{- end -}}
{{- if and $jwt (lt (len $jwt) 32) -}}
{{- fail (printf "secret.data.JWT_SECRET must be at least 32 characters (got %d)." (len $jwt)) -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "video-streaming.secretName" . }}
  labels:
    {{- include "video-streaming.labels" (dict "ctx" .) | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secret.data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
