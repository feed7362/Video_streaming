apiVersion: v1
kind: Service
metadata:
  name: {{ include "video-streaming.fullname" . }}-frontend
  labels:
    {{- include "video-streaming.labels" (dict "ctx" . "component" "frontend") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "video-streaming.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
