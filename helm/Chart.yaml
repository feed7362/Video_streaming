apiVersion: v2
name: video-streaming
description: Helm chart for the Video Streaming microservice stack (bff + frontend + convertor + deps).
version: 0.2.0
type: application
# appVersion drives the default image tag for bff/frontend/convertor.
# Bump together with image rebuilds.
appVersion: "0.2.0"

kubeVersion: ">=1.27.0-0"
home: https://github.com/feed7362/video_streaming
maintainers:
  - name: feed7362

dependencies:
  - name: postgresql
    version: 18.1.4
    repository: https://charts.bitnami.com/bitnami

  - name: minio
    version: 14.8.6
    repository: https://charts.bitnami.com/bitnami

  - name: rabbitmq
    version: 16.0.14
    repository: https://charts.bitnami.com/bitnami

  - name: vault
    version: 1.9.0
    repository: https://charts.bitnami.com/bitnami

  # --- Monitoring & Logging ---
  - name: loki
    version: 6.46.0
    repository: https://grafana.github.io/helm-charts

  - name: promtail
    version: 6.17.1
    repository: https://grafana.github.io/helm-charts

  - name: grafana
    version: 12.1.8
    repository: https://charts.bitnami.com/bitnami

  - name: prometheus
    version: 2.1.23
    repository: https://charts.bitnami.com/bitnami
