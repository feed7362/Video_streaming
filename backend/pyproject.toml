[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiobotocore>=2.24.2",
    "alembic>=1.16.5",
    "asyncpg>=0.30.0",
    "babel>=2.17.0",
    "cachetools>=6.2.4",
    "elasticsearch[async]>=9.2.0",
    "fastapi<0.128.0",
    "faststream[rabbit]>=0.5.48",
    "httpx>=0.28.1",
    "hvac>=2.3.0",
    "prometheus-client>=0.23.1",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.11.0",
    "python-keycloak>=5.8.1",
    "python-multipart>=0.0.20",
    "redis>=7.1.0",
    "sqlalchemy>=2.0.43",
    "uvicorn[standard]>=0.37.0",
    "uvloop; sys_platform == 'linux'",
    "xxhash>=3.6.0",
]

[dependency-groups]
dev = [
    "black>=25.9.0",
    "isort>=6.1.0",
    "mypy>=1.18.2",
    "pip-audit>=2.10.0",
    "pip-licenses>=5.5.0",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.13.3",
    "types-aiofiles>=25.1.0.20251011",
    "types-cachetools>=6.2.0.20251022",
    "types-hvac>=2.4.0.20251115",
    "types-python-dateutil>=2.9.0.20251115",
    "types-pyyaml>=6.0.12.20250915",
    "types-requests>=2.32.4.20250913",
    "types-ujson>=5.10.0.20250822",
]

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | alembic
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
skip = ["alembic", ".venv"]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["alembic", ".venv"]
fix = true

[tool.ruff.lint]
select = ["E", "F", "W", "I"]  # E/W — pycodestyle, F — pyflakes, I — isort

[tool.mypy]
python_version = 3.12
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
strict_optional = true
explicit_package_bases = true
exclude = "(alembic|.venv)"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
