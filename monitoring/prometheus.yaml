global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: "fastapi"
    metrics_path: /api/metrics
    static_configs:
      - targets: ["bff:8000"]

  - job_name: "ffmpeg"
    metrics_path: /api/metrics
    static_configs:
      - targets: ["ffmpeg:9102"]
